app {
  name = "EcommerceAnalytics"

  spark {
    master = "local[*]"
    shuffle.partitions = 8
  }

  optimization {
    enable-cache = true
    enable-broadcast = true
  }

  data {
    input {
      // Chemins relatifs à la racine du projet, car c'est de là que Spark
      // est lancé (que ce soit via "sbt run"/"sbt runMain" ou spark-submit
      // exécuté depuis EcommerceAnalytics/). Les fichiers de ressources
      // compilés (target/.../application.conf) ne sont PAS utilisés comme
      // base pour ces chemins : Spark les lit comme des chemins fichier
      // classiques, pas depuis le classpath.
      transactions = "src/main/resources/data/transactions.csv"
      users        = "src/main/resources/data/users.json"
      products     = "src/main/resources/data/products.parquet"
      merchants    = "src/main/resources/data/merchants.csv"
    }
    output {
      path = "output/"
    }
  }
}

validation {
  user {
    min-age = 16
    max-age = 100
  }
  product {
    min-rating = 1.0
    max-rating = 5.0
  }
}